defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.eval.eval_diffusion_agent.EvalDiffusionAgent

name: ${env_name}_eval_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/maniskill-eval/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
base_policy_path: ${oc.env:DPPO_LOG_DIR}/maniskill-pretrain/PickCube-v1_pre_diffusion_mlp_ta4_td20/2026-05-04_11-57-59_42/checkpoint/state_3000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/maniskill/${env_name}/normalization_rl.npz

seed: 42
device: cuda:0
env_name: PickCube-v1
obs_dim: 42
action_dim: 8
denoising_steps: 20
cond_steps: 1
horizon_steps: 4
act_steps: 4
ft_denoising_steps: 0
n_steps: 50
render_num: 2

env:
  n_envs: 40
  name: ${env_name}
  env_type: maniskill
  max_episode_steps: 200
  reset_at_iteration: False
  save_video: True
  best_reward_threshold_for_success: 0.5

model:
  _target_: model.diffusion.diffusion_eval.DiffusionEval
  ft_denoising_steps: ${ft_denoising_steps}
  predict_epsilon: True
  denoised_clip_value: 1.0
  network_path: ${base_policy_path}
  network:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    activation_type: ReLU
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}